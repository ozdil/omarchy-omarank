name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test and consistency checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: Shell syntax
        run: |
          bash -n omarank-status
          bash -n omarank-dashboard

      - name: Qt 6.12 palette guard
        # Qt 6.12's QtQuick `Color` type shadows Omarchy's palette singleton: use Commons.Color
        run: |
          if grep -nE '(^|[^.A-Za-z_])Color\.' Panel.qml; then
            echo "Bare Color.* found; import qs.Commons as Commons and use Commons.Color" >&2
            exit 1
          fi

      - name: Version consistency
        run: scripts/check-version.sh
